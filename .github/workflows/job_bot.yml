name: Is Ilani Botu

on:
  schedule:
    # Her saat başı otomatik çalışır
    - cron: '0 * * * *'
  workflow_dispatch:
    # Actions sekmesinden "Run workflow" butonuyla manuel çalıştırmanı sağlar

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Depo Dosyalarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests

      - name: Botu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python -c "import glob, os; files = glob.glob('**/bot.py', recursive=True); print('Bulunan dosyalar:', files); os.system(f'python {files[0]}')"
